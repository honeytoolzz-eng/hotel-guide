<style>
:root{--bg:#f6f4fb;--card:#fff;--tx:#1d1a2b;--sub:#5f5b74;--ac:#6c4cf1;--ac2:#ff6b9d;--ln:#e4e0f0;--wb:#fff0f2;--wt:#c4143c;--wl:#ffc2cd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#14121f;--card:#1f1c2e;--tx:#f1eefc;--sub:#b0acc8;--ln:#322e48;--wb:#3a1520;--wt:#ff8fa5;--wl:#5c2433}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;line-height:1.5}
a{color:var(--ac);font-weight:700;text-decoration:none}
.wrap{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px;text-align:center}
.langs{display:flex;gap:6px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.langs button{border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:7px 14px;border-radius:99px;font-size:14px;cursor:pointer}
.langs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.stage{background:var(--card);border-radius:24px;padding:26px 20px 20px;box-shadow:0 8px 30px rgba(108,76,241,.12);text-align:center;min-height:360px;display:flex;flex-direction:column;align-items:center}
.bars{display:flex;gap:4px;width:100%;margin-bottom:20px}
.bars i{flex:1;height:4px;border-radius:4px;background:var(--ln);overflow:hidden;display:block;cursor:pointer}
.bars i b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.ic{font-size:72px;line-height:1;animation:pop .5s ease}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.n{margin-top:12px;font-size:13px;font-weight:700;color:var(--ac);letter-spacing:.06em}
.t{font-size:22px;font-weight:800;margin:4px 0 8px}
.d{font-size:16px;color:var(--sub);max-width:360px;animation:pop .5s ease}
.warn{display:none;margin-top:10px;background:var(--wb);color:var(--wt);border:1px solid var(--wl);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700;max-width:360px}
#pnl{width:100%}
.pnl{background:#111;border-radius:14px;padding:10px 12px 12px;margin-top:14px;animation:pop .5s ease}
.cap{color:#aaa;font-size:12px;margin-bottom:8px}
.row{display:flex;gap:8px}
.pb{flex:1;position:relative;border:2px solid #3a3a3a;border-radius:8px;padding:8px 2px;font-weight:800;font-size:16px;color:#666;background:#000}
.pnl.k .pb{border-radius:22px}
.pb small{display:block;font-size:11px;font-weight:600;margin-top:2px}
.pb.hl{color:var(--c);border-color:var(--c);animation:blink 1s infinite}
.pb.no{border-color:#c33;color:#777}
.pnl.i img{display:block;width:72%;max-width:250px;margin:0 auto;border-radius:12px}.lg{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:10px;text-align:left;font-size:12px;color:#ccc}.lg b{color:#7fb0ff}
.pb.no::after{content:"✖";position:absolute;right:5px;top:0;color:#ff3b5c;font-size:15px}
@keyframes blink{50%{opacity:.45}}
.ctl{display:flex;gap:10px;justify-content:center;margin-top:16px}
.ctl button{width:52px;height:52px;border-radius:50%;border:none;background:var(--card);color:var(--tx);font-size:20px;box-shadow:0 2px 10px rgba(0,0,0,.1);cursor:pointer}
.ctl .play{background:var(--ac);color:#fff;width:60px;height:60px;margin-top:-4px}
.info{margin-top:16px;background:var(--card);border-radius:16px;padding:14px 16px;font-size:14px;color:var(--sub);display:grid;gap:4px}
.info b{color:var(--tx)}
.qr{margin-top:16px;background:var(--card);border-radius:24px;padding:22px;text-align:center}
.qr h2{font-size:17px;margin:0 0 4px}
.qr p{font-size:14px;color:var(--sub);margin:0 0 14px}
#qr{display:inline-block;background:#fff;padding:12px;border-radius:14px}
#qr img,#qr canvas{display:block}
.pr{margin-top:14px;border:1px solid var(--ac);color:var(--ac);background:none;padding:10px 18px;border-radius:12px;font-size:14px;cursor:pointer}
.stage .ic{font-size:44px}.stage .t{font-size:21px;margin:2px 0 4px}#items{width:100%}.it{background:var(--bg);border-radius:14px;padding:12px;margin-top:10px;text-align:left}.ih{display:flex;align-items:center;gap:8px;font-size:16px}.ii{font-size:24px}.it p{margin:6px 0 0;font-size:14px;color:var(--sub)}.it .warn{display:block;margin-top:8px;max-width:none}.it .pnl{margin-top:10px}.pnl.i img{width:60%}.kimg{position:relative;width:88%;max-width:300px;margin:0 auto}.kimg svg{width:100%;display:block;overflow:hidden}.rg{position:absolute;border:2px solid #ffd23f;border-radius:8px;animation:blink 1.2s infinite}.mk{position:absolute;width:22px;height:22px;border-radius:50%;background:#ffd23f;color:#000;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%);box-shadow:0 0 0 3px rgba(0,0,0,.5)}.rg.b{border-color:#a78bfa;border-width:3px;box-shadow:0 0 12px #a78bfa;animation:blink .9s infinite}.mk.b{background:#8b5cf6;color:#fff;width:26px;height:26px;font-size:14px}.kl .bl{color:#e9ddff;font-weight:700}.kl .bl i{background:#8b5cf6;color:#fff}.kimg.w{width:100%;max-width:340px}.kimg.n{width:62%;max-width:220px}.kimg.s{width:60%;max-width:230px}.rg.x{border-color:#ff3b5c;border-style:dashed}.mk.x{background:#ff3b5c;color:#fff}.rg.k{border-color:#ffd23f;border-width:3px;box-shadow:0 0 14px #ffd23f;animation:blink .9s infinite}.mk.k{background:#ffd23f;color:#000;width:26px;height:26px;font-size:14px}.kl .kg{color:#ffe9a0;font-weight:700}.kl .kg i{background:#ffd23f;color:#000}.kl .no{color:#ff9db0}.kl .no i{background:#ff3b5c;color:#fff}.kl{margin-top:10px;text-align:left;font-size:12px;color:#ddd;display:grid;gap:6px}.kl div{display:flex;gap:7px;align-items:flex-start}.kl i{flex:none;width:18px;height:18px;border-radius:50%;background:#ffd23f;color:#000;font-style:normal;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center}
@media print{body{background:#fff;color:#000}.langs,.stage,.info,.pr,h1{display:none}.qr{box-shadow:none;margin-top:40px}.qr p{color:#333}}
</style>
</head>

ko:{n:"한국어",ttl:"호텔 이용 가이드",ch:["체크인","외출·복귀","퇴실","객실 안내"],cap:["정산기","객실 입구 벽 패널","리모컨 [외부입력] 후 선택","입구 옆 벽 스위치 · 침대 옆 스위치","출입문 옆 패널과 열쇠 보관함","1층 프런트 키오스크"],QL:["'외출': 나가기 전에 누르세요","'퇴실': 마지막으로 나갈 때만 누르세요 (외출할 때는 누르지 마세요)","'취소': 잘못 눌렀을 때"],QK:"열쇠가 중요해요! 장시간 외출할 때는 이 열쇠로 문을 잠그세요. 잠그면 '외출복귀' 버튼으로 열리지 않아 안전해요.",KR:"정산기의 '외출복귀' 버튼을 누르세요",KF:["화면 아래에서 언어를 고르세요 (English · 中文 · 日本語)","예약하셨다면 '예약 확인', 아니면 '대실' · '숙박'을 누르세요","카드는 여기에서 결제하세요","영수증에서 객실 호수를 확인하세요","보라색 '호출벨'을 누르면 확인 후 객실을 열어 드려요"],K:["","",""],W:["","",""],KL:["'대실'(3시간) 또는 '숙박'(17시부터) 버튼을 누르세요","지폐 투입구에 1만원권을 한 장씩 천천히 넣으세요","거스름돈이 나오는 곳"],H:["일반 TV","OTT"],Lm:["메인 조명","조명 1","조명 2","조명 3","조명 4","전체 끄기","욕실"],
 s:[["카드 결제 · 예약 확인","1층 프런트 키오스크에서 진행해요. 예약하셨다면(야놀자, 여기어때 등) '예약 확인'을, 현장 결제는 '대실' 또는 '숙박'을 눌러 카드로 결제하세요. 영수증의 객실 호수를 확인하고 그 방으로 가세요.","객실 카드(카드키)는 없어요. 호출벨을 누르거나 070-4465-1051로 전화하시면 확인 후 객실을 열어 드려요."],
 ["현금으로 입실","비어 있는 객실의 주차장에 주차하세요. 계단 중간 정산기에서 '대실'(3시간) 또는 '숙박'(17시부터)을 누르고, 1만원권을 한 장씩 천천히 넣으면 문이 자동으로 열려요. 거스름돈은 아래로 나와요."],
 ["외출할 때는","객실 입구 벽의 패널에서 '외출' 버튼을 누르고 나가세요. 문을 닫으면 자동으로 잠겨요.","외출할 때는 '퇴실' 버튼을 누르지 마세요!"],
 ["장시간 외출할 때는","출입문 옆에 걸린 열쇠로 문을 잠그고 나가세요. 이렇게 잠그면 '외출복귀' 버튼을 눌러도 문이 열리지 않아 보안 걱정이 없어요. 돌아오면 같은 열쇠로 여세요."],
 ["외출 후 돌아오면","객실 문 앞 정산기의 '외출복귀' 버튼을 누르면 문이 열려요."],
 ["퇴실할 때는","퇴실 시간은 낮 12시까지예요. 최종 퇴실할 때만 패널의 '퇴실' 버튼을 눌러 주세요.","잠깐 외출할 때는 누르면 안 돼요."],
 ["퇴실 연장","시간당 10,000원이에요. 먼저 전화로 문의해 주세요. 입금 계좌: 하나은행 211-910773-66907 (예금주 황인찬)"],
 ["조명 켜는 법","입구 옆 벽 스위치와 침대 옆 스위치로 원하는 대로 조명을 조절하세요. 'ALL OFF'를 누르면 모든 조명이 꺼져요."],
 ["TV 보는 법","리모컨의 '외부입력' 버튼을 누른 뒤, 일반 TV는 HDMI 1, OTT(스트리밍)는 HDMI 2를 선택하세요."],
 ["금연 안내","모든 객실과 건물 안은 금연이에요(전자담배 포함). 적발 시 특수 청소비 200,000원이 부과될 수 있어요."]],
 info:["📞 문의","🕚 퇴실 시간","📶 Wi-Fi 무료 이용 가능","⏳ 대실 3시간 이용","🌙 숙박 입실 시간","➕ 연장 요금: 시간당 10,000원","🔞 미성년자 출입 금지"],qt:"QR로 가이드 다시 보기",qd:"카메라로 스캔하면 이 안내를 볼 수 있어요.",pr:"QR 인쇄하기"},
en:{n:"English",ttl:"Hotel Guest Guide",ch:["CHECK-IN","OUT & BACK","CHECK-OUT","ROOM INFO"],cap:["Kiosk","Wall panel at the room entrance","After pressing [External Input] on the remote","Wall switch by the entrance · Bedside switch","Panel and key box next to the entrance door","Kiosk at the 1st-floor front desk"],QL:["'Out' (외출): press before you leave","'Check-out' (퇴실): only when you leave for good, not when going out","'Cancel' (취소): if you pressed by mistake"],QK:"The key matters! For a long time out, lock the door with this key. A key-locked door can't be opened with 'Return room', so it stays secure.",KR:"Press 'Return room' (외출복귀) on the kiosk at your door",KF:["Choose your language at the bottom of the screen (English · 中文 · 日本語)","Tap 'Reservation check' (예약 확인) if you booked, or 'Rest Time' (대실) / 'Overnight' (숙박)","Pay with your card here","Check your room number on the receipt","Press the purple call bell and we'll check and open your room"],K:["Rest Time","Accommodate","Return room"],W:["Out","Check-out","Cancel"],KL:["Press 'Rest Time' (3 h) or 'Accommodate' (overnight, from 5 PM)","Insert 10,000-won bills here, one at a time, slowly","Change comes out here"],H:["Regular TV","OTT"],Lm:["Main light","Light 1","Light 2","Light 3","Light 4","Turn all off","Bathroom"],
 s:[["Card payment · Reservation check","Use the kiosk at the 1st-floor front desk. If you booked online (Yanolja, Yeogi-eottae, etc.), tap 'Reservation check'. Otherwise tap 'Rest Time' or 'Overnight' and pay by card. Check the room number on your receipt and go to that room.","There is no room key card. Press the call bell or call 070-4465-1051, and we will check and open your room."],
 ["Check-in with cash","Park in an empty room's parking space. At the kiosk on the stairs, press 'Rest Time' (3 hours) or 'Accommodate' (overnight, from 5 PM), then insert 10,000-won bills one at a time. The door opens automatically. Change comes out below."],
 ["Going out?","Press 'Out' (외출) on the wall panel at the room entrance, then leave. The door locks automatically when it closes.","Do NOT press 'Check-out' when going out!"],
 ["Out for a long time?","Lock the door with the key hanging next to the entrance, then leave. When locked this way, pressing 'Return room' will not open the door, so your room stays secure. Use the same key to unlock when you return."],
 ["Coming back","Press 'Return room' (외출복귀) on the kiosk at your room door. The door will open."],
 ["Check out","Checkout is by 12:00 noon. Press 'Check-out' (퇴실) on the panel only when you are leaving for good.","Don't press it for a short trip out."],
 ["Late check-out","10,000 KRW per hour. Please call first. Bank transfer: Hana Bank 211-910773-66907 (account holder: 황인찬)."],
 ["Room lights","Control the lights as you like with the wall switch next to the entrance or the switch beside the bed. 'ALL OFF' turns every light off."],
 ["TV & streaming","Press 'External Input' (외부입력) on the remote. Choose HDMI 1 for regular TV, HDMI 2 for streaming (OTT)."],

function paint(){
  var b=$("bars").children;
